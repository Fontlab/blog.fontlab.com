# this_file: mkdocs/mkdocs.yml

site_name: FontLab Blog
site_description: News, technical writing, and updates from FontLab.
site_url: https://blog.fontlab.com/
site_author: Fontlab Ltd.
copyright: Copyright © 2013–2026 Fontlab Ltd.

# Source Markdown lives in src_docs/md/; built HTML lands in docs/
# Paths are resolved relative to this mkdocs.yml file.
docs_dir: ../src_docs/md/
site_dir: ../docs/

use_directory_urls: true

theme:
  name: materialx
  custom_dir: mk-fontlab
  font: false
  features:
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: red

extra:
  homepage: https://blog.fontlab.com/
  generator: false

nav:
  - News: index.md
  - About: about.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      title: Contents
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: [src_docs/_partials]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

plugins:
  - search:
      enabled: true
  - include-markdown:
      opening_tag: "{!"
      closing_tag: "!}"
  - llmstxt:
      markdown_description: News, technical writing, and product updates from FontLab.
      full_output: llms-full.txt
      sections:
        Main pages:
          - index.md: Latest posts from the FontLab Blog.
          - about.md: FontLab company history and background.
        Blog posts:
          - posts/*.md
  - glightbox:
      # Zoom real artwork; leave UI chrome and small art alone.
      # `.illu-thumb` hero/index illustrations are click-targets on the blog
      # index (js/illu-link.js links them to the post), so they stay out.
      # Small images are excluded per image by hooks/glightbox_small_images.py.
      skip_classes:
        - illu-thumb
  - materialx/tags
  - materialx/blog:
      blog_dir: .
      blog_toc: false
      post_dir: posts
      post_url_format: "{date}/{slug}"
      post_excerpt: optional
      archive: true
      archive_name: Archive
      archive_toc: true
      categories: false
      authors: true
      authors_file: authors.yml
      authors_profiles: true
      authors_profiles_name: Topics
      authors_profiles_url_format: "topic/{slug}"
      authors_profiles_toc: true
      pagination_per_page: 30
      draft_on_serve: true
      draft_if_future_date: false
  - rss:
      match_path: "posts/.*"
      abstract_chars_count: 320
      abstract_delimiter: <!-- more -->
      categories:
        - tags
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
        default_timezone: UTC
      feed_title: FontLab Blog
      feed_description: News, technical writing, and updates from FontLab.
      image: https://i.fontlab.com/menu/fontlab-logo.svg
      json_feed_enabled: true
      length: 30
      pretty_print: false
      rss_feed_enabled: true
      use_git: true
      use_material_blog: true
      use_material_social_cards: false

hooks:
  - hooks/glightbox_small_images.py

extra_css:
  - css/fontlab-chrome.css
  - css/extra.css

extra_javascript:
  - js/illu-link.js
