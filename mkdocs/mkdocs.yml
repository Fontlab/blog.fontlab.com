# this_file: mkdocs/mkdocs.yml

site_name: FontLab Blog
site_description: News, technical writing, and updates from FontLab.
site_url: https://blog.fontlab.com/
site_author: Fontlab Ltd.
copyright: Copyright © 2013–2026 Fontlab Ltd.

# Source Markdown lives in src_docs/md/; built HTML lands in docs/
# Paths are resolved relative to this mkdocs.yml file.
docs_dir: ../src_docs/md/
site_dir: ../docs/

use_directory_urls: true

theme:
  name: fly-january
  # Only the blog's own templates (fly-january provides the rest): blog.html (homepage
  # hero), partials/post.html (excerpt layout), partials/footer.html (CTA band).
  custom_dir: mk-fontlab
  font: false
  features:
    - navigation.path
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: red

extra:
  homepage: https://blog.fontlab.com/
  generator: false
  fly:
    # Global FontLab menu and footer (mode="dark", site-url = site_url, MaterialX drawer
    # and search), as the old main.html configured them.
    chrome: fontlab
    chrome_options:
      site-label: Blog
      search-from: blog
    # No hue: H1 stays ink (near-black, as before); the theme's default accent (cobalt)
    # serves focus rings. FontLab red stays on the site's CTAs.
    # Typefaces of the previous build (measured): Outfit headings, system sans text.
    fonts:
      sources:
        - google:Outfit:wght@100..900
      roles:
        h1: {family: "'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 200}
        h2: {family: "'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 300}
        h3: {family: "'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 500}
        h4: {family: "'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 600}
        h5: {family: "'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 600}
        h6: {family: "'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 600}
        body: {family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 400}
        lead: {family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 400}
        table: {family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 400}
        nav: {family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"}
        caption: {family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"}
        code: {family: "ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"}
        em: {family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 400, adjust: 1}
        strong: {family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif", weight: 700, adjust: 1}

nav:
  - News: index.md
  - About: about.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      title: Contents
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: [src_docs/_partials]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

plugins:
  - materialx/search:
      enabled: true
  - include-markdown:
      opening_tag: "{!"
      closing_tag: "!}"
  - llmstxt:
      markdown_description: News, technical writing, and product updates from FontLab.
      full_output: llms-full.txt
      sections:
        Main pages:
          - index.md: Latest posts from the FontLab Blog.
          - about.md: FontLab company history and background.
        Blog posts:
          - posts/*.md
  - glightbox:
      # Zoom real artwork; leave UI chrome and small art alone.
      # `.illu-thumb` hero/index illustrations are click-targets on the blog
      # index (js/illu-link.js links them to the post), so they stay out.
      # Small images are excluded per image by hooks/glightbox_small_images.py.
      skip_classes:
        - illu-thumb
  - materialx/tags
  - materialx/blog:
      blog_dir: .
      blog_toc: false
      post_dir: posts
      post_url_format: "{date}/{slug}"
      post_excerpt: optional
      archive: true
      archive_name: Archive
      archive_toc: true
      categories: false
      authors: true
      authors_file: authors.yml
      authors_profiles: true
      authors_profiles_name: Topics
      authors_profiles_url_format: "topic/{slug}"
      authors_profiles_toc: true
      pagination_per_page: 30
      draft_on_serve: true
      draft_if_future_date: false
  - rss:
      match_path: "posts/.*"
      abstract_chars_count: 320
      abstract_delimiter: <!-- more -->
      categories:
        - tags
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
        default_timezone: UTC
      feed_title: FontLab Blog
      feed_description: News, technical writing, and updates from FontLab.
      image: https://i.fontlab.com/menu/fontlab-logo.svg
      json_feed_enabled: true
      length: 30
      pretty_print: false
      rss_feed_enabled: true
      use_git: true
      use_material_blog: true
      use_material_social_cards: false
  # fly-january: fonts, chrome, body classes (last).
  - fly

hooks:
  - hooks/glightbox_small_images.py
  - hooks/site_head.py

extra_css:
  - css/extra.css

extra_javascript:
  # Tailwind Play CDN for the unprefixed utility classes in posts, then its settings.
  - https://cdn.tailwindcss.com
  - js/tailwind-config.js
  - js/illu-link.js
